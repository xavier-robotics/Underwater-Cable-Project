max_attempts: 2
confidence_threshold: 0.65
position_majority_threshold: 0.6
clear_damage_threshold: 0.75
retry_policy: all_failures
cache_results: true
agent_batch_size: 6

rounds:
  - max_frames_per_sample: 3
    min_frames: 3
    evidence_mode: full-and-crop
  - max_frames_per_sample: 5
    min_frames: 3
    evidence_mode: full-and-crop
