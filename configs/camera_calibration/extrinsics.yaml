mode: extrinsic

intrinsics_file: ../../outputs/camera_calibration/intrinsics/intrinsics.yaml

frames:
  base_frame: base_link
  camera_mechanical_frame: camera_link
  camera_frame: camera_optical_frame
  target_frame: calibration_target

target:
  type: checkerboard
  inner_corners_cols: 8
  inner_corners_rows: 6
  square_size_m: 0.05
  target_origin: first_inner_corner

# Replace each null with the surveyed full fixture pose. A distance alone is invalid.
datasets:
  - name: pose_01
    video: ../../data/calibration/extrinsics/pose_01.mp4
    frame_interval_sec: 0.5
    T_base_target: null

  - name: pose_02
    video: ../../data/calibration/extrinsics/pose_02.mp4
    frame_interval_sec: 0.5
    T_base_target: null

quality:
  min_frames_per_dataset: 5
  max_frames_per_dataset: 10
  min_total_observations: 3
  blur_threshold: 80
  min_board_area_ratio: 0.005
  duplicate_distance: 0.02

outlier_rejection:
  max_reprojection_error_px: 1.5
  max_translation_residual_mm: 10.0
  max_rotation_residual_deg: 1.0

optimization:
  enabled: true
  robust_loss: huber
  f_scale_px: 1.0
  max_iterations: 200

output:
  directory: ../../outputs/camera_calibration/extrinsics

