project:
  language: Python
  operating_system: Ubuntu
  ros_version: none
  opencv_version: auto_detect

camera:
  camera_name: underwater_camera
  image_source: video
  image_width: 1920
  image_height: 1080
  model: pinhole
  image_topic: /camera/image_raw
  fixed_focus: true

frames:
  base_frame: base_link
  camera_mechanical_frame: camera_link
  camera_optical_frame: camera_optical_frame
  target_frame: calibration_target

target:
  type: checkerboard
  inner_corners_cols: 8
  inner_corners_rows: 6
  square_size_m: 0.05
  target_origin: first_inner_corner

housing:
  type: flat
  port_material: acrylic
  port_thickness_m: 0.01
  dome_radius_m: null
  refractive_index_air: 1.0003
  refractive_index_port: 1.49
  refractive_index_water: 1.333

