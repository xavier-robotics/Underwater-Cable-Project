intact_templates:
  - intact {noun}
  - undamaged {noun}
  - smooth {noun} surface
  - normal {noun}

exposed_templates:
  - "{noun} resting on pool floor"
  - "{noun} lying on pool floor"
  - "{noun} touching pool floor"

suspended_templates:
  - suspended {noun}
  - hanging {noun}
  - "{noun} above pool floor"

search:
  top_individual_damage_prompts: 18
  max_damage_prompt_count: 4
  max_reported_combinations: 25

# This is the deliberately selected robust configuration. It is not simply
# the highest-scoring combination on eight samples: semantic clarity, zero
# false-positive frames and support on at least two frames of every damaged
# sample are also required.
selected:
  localization_prompt: pipe
  damage_positive_prompts:
    - surface damage
    - metal patch on black pipe
    - broken cable jacket
  damage_prompt_groups:
    semantic_damage:
      - surface damage
    metal_exposure:
      - metal patch on black pipe
    structural_damage:
      - broken cable jacket
  intact_prompts:
    - intact cable
    - undamaged cable
    - smooth cable surface
  exposed_prompts:
    - cable resting on pool floor
    - cable lying on pool floor
    - cable touching pool floor
  suspended_prompts:
    - suspended cable
    - hanging cable
    - cable above pool floor
  rationale:
    - pipe is specific and stable; generic cylindrical prompts produce larger masks
    - metal patch on black pipe matches the current metallic-sticker simulation
    - broken cable jacket preserves a physical real-damage description
    - synonyms are maximized inside groups and cannot duplicate consensus votes
    - the selected groups have zero false-positive frames on current intact samples
    - every current damaged sample has supporting evidence on at least two frames
    - cable position prompts are semantically correct and tied for the best result
