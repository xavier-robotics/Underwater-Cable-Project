  - pipe
  - cable
  - beam
  - hose
  - tube
  - underwater cable
  - submarine cable
  - underwater pipe
  - black cable
  - black pipe
  - rubber hose
  - flexible hose
  - cylindrical object
  - cylindrical structure

damage_templates:
  - damaged {noun}
  - broken {noun}
  - cut {noun}
  - cracked {noun}
  - split {noun}
  - "{noun} surface defect"

damage_additional_prompts:
  - cable with exposed wires
  - cable with missing sheath
  - cable with damaged sheath
  - cable with torn sheath
  - exposed metal on cable
  - exposed armor on cable
  - exposed conductor on cable
  - damaged cable jacket
  - missing cable jacket
  - pipe with exposed metal
  - pipe with missing outer layer
  - pipe with damaged surface
  - damaged pipe coating
  - hose with exposed reinforcement
  - hose with torn outer layer
  - damaged outer layer
  - exposed metal section
  - exposed wire section
  - missing outer layer
  - surface damage

# Prompts in one group describe the same evidence concept. During deployment
# the group takes a maximum, so several synonyms matching one sticker count as
# one piece of evidence rather than several independent votes.
damage_candidate_groups:
  semantic_damage:
    - surface damage
    - cable with damaged sheath
    - damaged cable jacket
  sheath_loss:
    - missing black outer sheath
    - peeled cable jacket
    - torn outer coating
    - exposed inner layer
  metal_exposure:
    - silver metallic patch on black cable
    - exposed metallic layer on cable
    - bright metal patch on black pipe
    - reflective metal area on cable
    - silver patch on black cable
    - metal patch on black pipe
    - silver patch
    - metallic patch
  structural_damage:
    - cut cable sheath
    - cracked cable jacket
    - split outer sheath
    - broken cable jacket

deployment_candidates:
  validated_balanced:
    semantic_damage:
      - surface damage
    metal_exposure:
      - metal patch on black pipe
    structural_damage:
      - broken cable jacket
  visual_structural:
    metal_exposure:
      - metal patch on black pipe
    structural_damage:
      - broken cable jacket
  single_visual:
    metal_exposure:
      - silver patch
  compact_balanced:
    semantic_damage:
      - cable with damaged sheath
    metal_exposure:
      - silver patch
    structural_damage:
      - broken cable jacket
  robust_balanced:
    semantic_damage:
      - surface damage
      - cable with damaged sheath
    sheath_loss:
      - torn outer coating
    metal_exposure:
      - silver patch
      - metal patch on black pipe
    structural_damage:
      - broken cable jacket
  simulation_focused:
