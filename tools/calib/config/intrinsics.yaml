mode: intrinsic

input:
  type: video
  path: ../data/underwater_intrinsics.mp4
  frame_interval_sec: 0.5

camera:
  camera_name: underwater_camera
  model: pinhole
  image_width: 1920
  image_height: 1080
  fixed_focus: true
  # Dedicated sealed camera: calibrate the complete camera in its deployment
  # medium. Use "air" only if the camera will actually operate in air.
  calibration_environment: underwater

target:
  type: checkerboard
  inner_corners_cols: 11
  inner_corners_rows: 8
  square_size_m: 0.04
  target_origin: first_inner_corner

quality:
  min_valid_frames: 20
  max_valid_frames: 60
  blur_threshold: 80
  reject_overexposed: true
  reject_underexposed: true
  max_overexposed_ratio: 0.20
  max_underexposed_ratio: 0.20
  min_board_area_ratio: 0.005
  duplicate_distance: 0.06

outlier_rejection:
  max_reprojection_error_px: 1.5
  mad_factor: 3.5
  max_rounds: 2

output:
  directory: ../output/intrinsics
