[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uw-camera-calibration"
version = "1.0.0"
description = "Air, mechanical, and refractive underwater camera calibration"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.scripts]
camera_calibration = "camera_calibration.cli:main"

[tool.setuptools.packages.find]
include = ["camera_calibration*"]

